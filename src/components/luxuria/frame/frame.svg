<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" viewBox="0 0 45 45">
  <!-- Moldura das capas de "Luxúria" e "Pecado Capital", para border-image
       com slice 16: cantos de 16×16, faixas de 16 de espessura e uma volta
       de 13 do friso entre os cantos. Cores fixas: carmim #871c21 no fundo da
       faixa, creme #e4cfb4 no friso (as mesmas de app/luxuria/globals.css). -->
  <defs>
    <!-- A gota: bojo para fora, ponta para dentro. -->
    <path id="d" d="M6.5 9.8C5.028 8.348 4.2 6.852 4.2 5.4a2.3 2.3 0 0 1 4.6 0c0 1.452-.828 2.948-2.3 4.4z"/>
    <!-- Uma volta, com a borda de fora em y=0: a gota presa no V e meio ponto
         de cada lado, que se completa com a volta vizinha ou com o canto. -->
    <g id="m">
      <path d="M0 2 6.5 13 13 2" fill="none" stroke="#e4cfb4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#d"/>
      <circle cx="0" cy="14.4" r="1.15"/>
      <circle cx="13" cy="14.4" r="1.15"/>
    </g>
  </defs>
  <rect width="45" height="45" fill="#871c21"/>
  <g fill="#e4cfb4">
    <use href="#m" transform="translate(16 0)"/>
    <use href="#m" transform="matrix(1 0 0 -1 16 45)"/>
    <use href="#m" transform="matrix(0 1 1 0 0 16)"/>
    <use href="#m" transform="matrix(0 1 -1 0 45 16)"/>
    <!-- Nos cantos, uma gota maior na diagonal, apontando para fora. -->
    <use href="#d" transform="translate(7 7) rotate(-45) scale(1.2) translate(-6.5 -6.45)"/>
    <use href="#d" transform="translate(38 7) rotate(45) scale(1.2) translate(-6.5 -6.45)"/>
    <use href="#d" transform="translate(7 38) rotate(-135) scale(1.2) translate(-6.5 -6.45)"/>
    <use href="#d" transform="translate(38 38) rotate(135) scale(1.2) translate(-6.5 -6.45)"/>
  </g>
</svg>
